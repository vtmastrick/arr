- name: unmount before applying creating
  mount:
    path: "{{ entry.mount }}"
    src: "{{ entry.device }}"
    fstype: "{{ entry.fstype }}"
    opts: "{{ entry.options }},nodev"
    state: unmounted
  when: entry.fstype == "cifs"

- name: create directory "{{ entry.mount }}" for "{{ fstab_user }}"
  file:
    path: "{{ entry.mount }}"
    state: directory
    owner: "{{ entry.user }}"
    group: "{{ entry.group }}"
  when: entry.fstype == "cifs"
  
- name: Ensure fstab uses nodev
  mount:
    path: "{{ entry.mount }}"
    src: "{{ entry.device }}"
    fstype: "{{ entry.fstype }}"
    opts: "{{ entry.options }},nodev"
    state: present
  when: entry.fstype == "cifs"
  
- name: Mount device
  mount:
    path: "{{ entry.mount }}"
    src: "{{ entry.device }}"
    fstype: "{{ entry.fstype }}"
    opts: "{{ entry.options }},nodev"
    state: mounted
  when: entry.fstype == "cifs"  




