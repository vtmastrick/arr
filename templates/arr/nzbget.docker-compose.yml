---
services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=2080
      - PGID=8888
      - TZ=America/New_York
    volumes:
      - ./config:/config
      - /mnt/nzbget/usenet/completed:/data/usenet/downloads/completed #optional
      - ./main:/data/usenet/main
    ports:
      - 6789:6789
    restart: unless-stopped
    networks:
      - arr_network
      - nginx-bridge

networks:
  arr_network:
    external: true
  nginx-bridge:
    external: true

